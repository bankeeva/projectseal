[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projectseal"
version = "1.0.0"
description = "Локальная проверка проекта и создание чистого ZIP перед передачей"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<6.9"]
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["projectseal*"]

[tool.setuptools.package-data]
"projectseal.resources" = ["*.json", "*.svg", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
